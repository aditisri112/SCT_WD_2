<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aesthetic Stopwatch</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #f8ede3,
        #f9dcc4,
        #f7cad0,
        #eac4d5
    );
    padding:20px;
}

.container{
    width:400px;
    background:rgba(255,255,255,0.45);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.6);
    border-radius:30px;
    padding:35px;
    text-align:center;
    box-shadow:0 10px 30px rgba(110,90,90,0.15);
}

h1{
    color:#7b5e65;
    font-size:2rem;
    font-weight:600;
    margin-bottom:20px;
}

.time{
    font-size:3.5rem;
    font-weight:700;
    color:#6d6875;
    margin:25px 0;
    letter-spacing:2px;
}

.buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:25px;
}

button{
    border:none;
    border-radius:15px;
    padding:12px 18px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    transition:all 0.3s ease;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 6px 15px rgba(0,0,0,0.1);
}

.start{
    background:#d8e2dc;
    color:#4f5d4f;
}

.pause{
    background:#f9dcc4;
    color:#8a5a44;
}

.reset{
    background:#f7cad0;
    color:#8f4d5a;
}

.lap{
    background:#e2d4f0;
    color:#66507a;
}

.lap-section{
    text-align:left;
}

.lap-title{
    color:#7b5e65;
    margin-bottom:10px;
    font-size:1rem;
    font-weight:600;
}

#laps{
    list-style:none;
    max-height:220px;
    overflow-y:auto;
}

#laps li{
    background:rgba(255,255,255,0.55);
    margin-bottom:10px;
    padding:12px;
    border-radius:12px;
    color:#6d6875;
    border-left:4px solid #d6ccc2;
    font-size:14px;
}

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-thumb{
    background:#d6ccc2;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

    <h1> Stopwatch </h1>

    <div class="time" id="display">
        00:00:00
    </div>

    <div class="buttons">
        <button class="start" onclick="startTimer()">Start</button>
        <button class="pause" onclick="pauseTimer()">Pause</button>
        <button class="reset" onclick="resetTimer()">Reset</button>
        <button class="lap" onclick="recordLap()">Lap</button>
    </div>

    <div class="lap-section">
        <div class="lap-title">♡ Lap Times</div>
        <ul id="laps"></ul>
    </div>

</div>

<script>

let seconds = 0;
let minutes = 0;
let hours = 0;
let timer = null;

function updateDisplay() {

    let h = String(hours).padStart(2,'0');
    let m = String(minutes).padStart(2,'0');
    let s = String(seconds).padStart(2,'0');

    document.getElementById("display").textContent =
        `${h}:${m}:${s}`;
}

function startTimer() {

    if(timer !== null) return;

    timer = setInterval(() => {

        seconds++;

        if(seconds === 60){
            seconds = 0;
            minutes++;
        }

        if(minutes === 60){
            minutes = 0;
            hours++;
        }

        updateDisplay();

    },1000);
}

function pauseTimer() {

    clearInterval(timer);
    timer = null;
}

function resetTimer() {

    clearInterval(timer);
    timer = null;

    seconds = 0;
    minutes = 0;
    hours = 0;

    updateDisplay();

    document.getElementById("laps").innerHTML = "";
}

function recordLap() {

    if(hours === 0 && minutes === 0 && seconds === 0) return;

    const lapList = document.getElementById("laps");

    const lapItem = document.createElement("li");

    const lapNumber = lapList.children.length + 1;

    lapItem.textContent =
        `Lap ${lapNumber} • ${document.getElementById("display").textContent}`;

    lapList.prepend(lapItem);
}

</script>

</body>
</html>
